# Honor an upstream X-Forwarded-Proto when an outer reverse proxy or
# Cloudflare tunnel terminates TLS in front of this nginx; otherwise fall back
# to the inner connection's scheme. Required so Engine.IO's same-origin check
# computes https:// (matching the browser's Origin header) when applicable.
# Pass the value through verbatim — Engine.IO splits on commas and strips
# whitespace, so chained values like "https, http" resolve correctly.
map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

# Identify link-unfurl crawlers (iMessage/LinkPresentation, Slack, Discord,
# WhatsApp, Telegram, etc.). They fetch a URL once, read <head> meta tags, and
# never run JavaScript — so this pure SPA gives them no per-page Open Graph
# data. Only these user-agents are routed to the server-rendered OG card (see
# the /bird/.../recording/ location below); humans always get the SPA.
map $http_user_agent $is_link_crawler {
    default 0;
    "~*(facebookexternalhit|Facebot|Twitterbot|Slackbot|Discordbot|WhatsApp|TelegramBot|LinkedInBot|Applebot|SkypeUriPreview|redditbot|Pinterest|Embedly|Iframely|vkShare|Googlebot|bingbot|Mastodon|Bluesky)" 1;
}

# Per-IP read-path throttle. The API bounds what one request can return; this
# is the complementary bound on requests-over-time, so a scraper can't turn
# the bounded public view into a full-archive dump by sheer request volume.
# 30 r/s sustained is far above any human browsing pattern (the gallery
# lazy-loads images, the table pages by 16) but caps bulk enumeration.
# The login zone is much tighter — the app's own attempt-lockout remains the
# primary brute-force control; this just cheapens the rejects.
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_rl:10m rate=1r/s;
limit_req_status 429;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Everything is served/bundled same-origin except the gallery's bird
    # images, which load straight from Wikimedia (the backend validates saved
    # image URLs to https://*.wikimedia.org). 'unsafe-inline' style is required
    # by Vue's :style bindings; ws:/wss: by the Socket.IO transport; blob:/data:
    # by the spectrogram/audio pipelines' generated resources.
    # 'wasm-unsafe-eval' permits WebAssembly compilation ONLY (not JS eval) —
    # the Live Feed's Safari path decodes the stream with a bundled WASM MP3
    # decoder (mpg123-decoder in useIcecastStream); without this Safari/iOS
    # lose the live spectrogram and fall back to plain playback.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.wikimedia.org; media-src 'self' blob:; connect-src 'self' ws: wss:; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Allow large file uploads (for database migration)
    client_max_body_size 500M;

    # Login gets its own tight throttle (exact match beats the ^~ /api/ prefix).
    location = /api/auth/login {
        limit_req zone=login_rl burst=5 nodelay;

        proxy_pass http://api:5002;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # API proxy - forward /api/ requests to API server
    # IMPORTANT: ^~ modifier prevents regex matches (like .png) from taking precedence
    location ^~ /api/ {
        limit_req zone=api_rl burst=60 nodelay;

        proxy_pass http://api:5002;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Longer timeouts for migration imports
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Internal auth verification endpoint (for nginx auth_request)
    location = /internal/auth {
        internal;
        proxy_pass http://api:5002/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    # Auth error handler - returns JSON for API clients
    location @stream_unauthorized {
        default_type application/json;
        return 401 '{"error": "Authentication required"}';
    }

    # Icecast audio stream proxy - forward /stream/ requests to Icecast server
    # Protected by authentication when enabled
    location ^~ /stream/ {
        auth_request /internal/auth;
        error_page 401 = @stream_unauthorized;

        proxy_pass http://icecast:8888/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Streaming-specific settings
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Handle static assets with long cache times
    # Note: /api/ routes are handled above, so this only affects local static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Per-detection rich link previews (Open Graph). A shared detection
    # permalink (/bird/<name>/recording/<id>) is a client-rendered SPA route,
    # so unfurl crawlers see only the static index.html. For those crawlers we
    # internally hand off to the API's server-rendered OG card; everyone else
    # gets the SPA via the same try_files fallback. Only the numeric id is
    # proxied (the <name> segment is decorative), which dodges URL-encoding
    # issues with spaces in species names. `rewrite ... last` inside `if` is the
    # nginx-blessed safe form (avoids the if + proxy_pass + try_files pitfall).
    location ~ ^/bird/.+/recording/(?<og_recording_id>[0-9]+)/?$ {
        if ($is_link_crawler) {
            rewrite ^ /_og/recording/$og_recording_id last;
        }
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/_og/recording/(?<og_recording_id>[0-9]+)$ {
        internal;
        # $is_args$args must be spelled out: proxy_pass with a variable URI
        # doesn't forward the query string on its own, and a share token
        # (?s=...) is what entitles the card to detail a private detection.
        proxy_pass http://api:5002/api/og/recording/$og_recording_id$is_args$args;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Handle Vue.js SPA routing - serve index.html for all routes that don't match static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Socket.IO WebSocket proxy - forward /socket.io/ requests to API server
    location /socket.io/ {
        proxy_pass http://api:5002/socket.io/;
        proxy_http_version 1.1;
        proxy_buffering off;
        # Idle WebSockets must outlive nginx's 60s default read timeout;
        # Engine.IO ping/pong remains the real liveness mechanism. Matches the
        # 3600s convention used by the /stream/ block above.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Preserve the externally requested origin, including non-default ports,
        # so Flask-SocketIO same-origin checks work behind reverse proxies.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
